openapi: 3.0.3
info:
  title: Todo API
  description: CRUD Todo List sederhana — layered arch (handler → service → repository).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: local dev
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
  /api/v1/todos:
    post:
      summary: Buat todo baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      summary: List todos
      parameters:
        - $ref: '#/components/parameters/QuerySearch'
        - $ref: '#/components/parameters/FilterCompleted'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/todos/{id}:
    parameters:
      - $ref: '#/components/parameters/TodoID'
    get:
      summary: Detail todo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update keterangan dan/atau status (minimal satu field)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Hapus todo (hard delete)
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    TodoID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    QuerySearch:
      name: q
      in: query
      schema:
        type: string
      description: Cari di title / description (ILIKE)
    FilterCompleted:
      name: is_completed
      in: query
      schema:
        type: boolean
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
      description: Default 20, maks 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
  schemas:
    Todo:
      type: object
      required: [id, title, description, is_completed, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Belajar Go
        description:
          type: string
          example: Coba layered arch
        is_completed:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTodoRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
          example: Belajar Go
        description:
          type: string
          maxLength: 1000
          example: Coba layered arch
        is_completed:
          type: boolean
          example: false
    UpdateTodoRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        is_completed:
          type: boolean
    TodoEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Todo'
    TodoListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Todo'
    DataEnvelope:
      type: object
      properties:
        data:
          type: object
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
              example: todo tidak ditemukan
  responses:
    BadRequest:
      description: Bad request / validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Todo tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
